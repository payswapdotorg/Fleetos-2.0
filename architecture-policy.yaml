version: 2

# Transitional policy for the FleetOS 2.0 fork.
# ZCode modules are legacy substrate until explicitly adopted into the
# FleetOS bounded-context map. New FleetOS modules become managed as they land.

modules:
  - id: zcode-rpc
    roots: [packages/rpc/src]
    managed: false
  - id: zcode-shared
    roots: [packages/shared/src]
    managed: false
  - id: zcode-provider
    roots: [packages/provider/src]
    managed: false
  - id: zcode-provider-node
    roots: [packages/provider-node/src]
    managed: false
  - id: zcode-services
    roots: [packages/services/src]
    managed: false
  - id: zcode-client
    roots: [packages/client/src]
    managed: false
  - id: zcode-server
    roots: [packages/server/src]
    managed: false
  - id: zcode-ui
    roots: [packages/ui/src]
    managed: false
  - id: zcode-web
    roots: [packages/web/src]
    managed: false
  - id: zcode-desktop
    roots: [packages/desktop/src]
    managed: false
  - id: zcode-cli
    roots: [apps/zcode-cli]
    managed: false

global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true

# FleetOS bounded contexts are registered here as they are created by Wave 0.
# The canonical ownership/dependency definition is in:
# - spec/BOUNDED-CONTEXTS.md
# - spec/DEPENDENCY-GRAPH.md
# - spec/worker-ownership.yaml

exceptions: []
